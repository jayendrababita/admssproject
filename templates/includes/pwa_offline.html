{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — ADMSS</title>
  <link rel="icon" href="{% static 'assets/admssfevicon.ico' %}" type="image/x-icon">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 1rem;
    }
    .card {
      max-width: 24rem;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.25rem; color: #666; font-size: 0.95rem; }
    button {
      background: #44444b;
      color: #fff;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>ADMSS Portal needs an internet connection. Check your network and try again.</p>
    <button type="button" onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
