{% load static %}
<!DOCTYPE html>
<html>
    
<head>
	<title>Login</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">
	<link rel="stylesheet" href="/static/assets/css/btnbootstrap.css">
	<script src="/static/assets/js/bootstrap.bundle.js"></script>
	<link rel="stylesheet" href="/static/assets/css/stylelockscreen.css">
	<script src="/static/assets/js/stylelockscreen.js"></script>
	<style>
		body,
		html {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #fff; 
			
		}
		.user_card {
			width: 350px;
			margin-top: auto;
			margin-bottom: auto;
			background: rgb(68, 68, 75);
			position: relative;
			display: flex;
			justify-content: center;
			flex-direction: column;
			padding: 10px;
			box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
			-webkit-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
			-moz-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
			border-radius: 5px;

		}

		.form_container {
			margin-top: 20px;
		}

		#form-title{
			color: #fff;
    	}

		.login_btn {
			width: 100%;
			background: #1780a3 !important;
			color: white !important;
		}
		.login_btn:focus {
			box-shadow: none !important;
			outline: 0px !important;
		}
		.login_container {
			padding: 0 2rem;
		}
		.input-group-text {
			background: #f7ba5b !important;
			color: white !important;
			border: 0 !important;
			border-radius: 0.25rem 0 0 0.25rem !important;
		}
		.input_user,
		.input_pass:focus {
			box-shadow: none !important;
			outline: 0px !important;
		}

		#messages{
			background-color: grey;
			color: #fff;
			padding: 10px;
			margin-top: 10px;
		}


		@media only screen and(max-width:678px){
			.bg{
			  background-size:300%
			}
	</style>

</head>
<body>
	<div class="container h-100">
		<div id="skm_LockPane" class="LockOff"></div>
		<div class="d-flex justify-content-center h-100">
			<div class="user_card" style="width:450px;height:450px;">

				<br>
				<div class="d-flex justify-content-center">
     			<img src="/static/assets/img/admss.gif" alt="ADMSS" width= 90px, height=90px  class="brand-image" style="opacity: .8">
				</div>
				<br>
				<div class="d-flex justify-content-center">
					<h5 id="form-title">ADMSS-LOGIN</h5>
				</div>

				<div class="d-flex justify-content-center form_container">
					<form method="post" action="{% url 'login' %}" id="admss-login-form" autocomplete="on">
						{% csrf_token %}

						<div class="input-group mb-3">
							<div class="input-group-append">
								<span class="input-group-text"><i class="fas fa-user"></i></span>
							</div>
							<input type="text" name="username" id="username" placeholder="Username..." class="form-control" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
						</div>
						<div class="input-group mb-2">
							<div class="input-group-append">
								<span class="input-group-text"><i class="fas fa-key"></i></span>
							</div>
							<input type="password" name="password" id="password" placeholder="Password..." class="form-control" autocomplete="current-password" required>
						</div>
					


							<div class="d-flex justify-content-center mt-3 login_container">
								<button class="btn btn-info" name="submit" id="submit" style="color: white; width:125px;" type="submit" onclick="skm_LockScreen();">Login</button>
							  </div>
						<br>
							   
					</form>

				</div>

	
				{% if success %}
				<div id="mess">        
				<label style="margin-left:22%;color: white"><strong>{{message}}</strong></label>
				</div>
				
				{% endif %}				



			</div>
		</div>
	</div>
  <script src="/static/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>


</html>
